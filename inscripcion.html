<body>

    <section id="inscripcion" class="contacto-section">
    <div class="contacto-container">
        <h3>Inscripción</h3>
        <p>Una vez enviado el formulario, completá las planillas de inscripción y acercalas a la escuela</p>
        
        <form action="#" method="POST" class="contacto-form">
            <div class="form-group">
                <label >Datos del/la ingresante</label>
                <input type="text" placeholder="Apellido/s" required>
                <br><input type="text" placeholder="Nombre/s" required>
                <input type="text" placeholder="DNI" required>
                <input type="text" placeholder="Fecha de Nacimiento" required>
            </div>

            <div class="form-group">
                <label >Escuela de procedencia</label>
                <select>
                    <option>Primaria</option>
                    <option>Secundaria</option>
                </select>
                <textarea>N°</textarea>
            </div>

            <div class="form-group">
                <label >Datos de Madre/Padre/Tutor</label>
                <select>
                    <option>Madre</option>
                    <option>Padre</option>
                    <option>Tutor/a</option>
                </select>
                <input type="text" placeholder="Apellido/s">
                <input type="text" placeholder="Nombre/s">
                <input type="text" placeholder="DNI">
                <input type="text" placeholder="Teléfono">
                <input type="text" placeholder="Domicilio">
                <input type="text" placeholder="Localidad">
            </div>

            <button type="submit" class="btn-enviar">Enviar Formulario</button>
        </form>
    </div>
</section>
