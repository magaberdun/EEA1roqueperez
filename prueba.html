<link rel="stylesheet" href="style.css">


<section id="inscripcion" class="contacto-section">
    <div class="contacto-container">
        <h3>Inscripción y Consultas</h3>
        <p>Completá el formulario y nos pondremos en contacto con vos a la brevedad.</p>
        
        <form action="#" method="POST" class="contacto-form">
            <div class="form-group">
                <label for="nombre">Nombre Completo</label>
                <input type="text" id="nombre" name="nombre" placeholder="Tu nombre..." required>
            </div>

            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
            </div>

            <div class="form-group">
                <label for="disciplina">Disciplina de Interés</label>
                <select id="disciplina" name="disciplina">
                    <option value="artes-visuales">Artes Visuales</option>
                    <option value="musica">Música</option>
                    <option value="teatro">Teatro</option>
                    <option value="literatura">Literatura</option>
                    <option value="danza">Danza/Expresión Corporal</option>
                    <option value="talleres">Talleres Especiales</option>
                </select>
            </div>

            <div class="form-group">
                <label for="mensaje">Mensaje o Consulta</label>
                <textarea id="mensaje" name="mensaje" rows="4" placeholder="Escribí tu consulta aquí..."></textarea>
            </div>

            <button type="submit" class="btn-enviar">Enviar Formulario</button>
        </form>
    </div>
</section>
